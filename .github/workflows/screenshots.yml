name: Screenshots
# Run manually (Actions tab > Screenshots > Run workflow). Captures the real app on an iPhone Pro Max
# simulator, then adds captions. Download the "screenshots" artifact: raw/ and framed/.
on:
  workflow_dispatch:
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - name: Capture from the real app
        run: Scripts/capture-screenshots.sh build/screenshots/raw
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add captions
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install chromium
          node Scripts/frame-screenshots.mjs build/screenshots/raw build/screenshots/framed
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: build/screenshots
          retention-days: 30
      - name: Keep the test result bundle if capture failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: xcresult
          path: build/screenshots.xcresult
