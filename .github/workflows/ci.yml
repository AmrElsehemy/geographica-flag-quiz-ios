name: CI
on:
  push:
    branches: [master]
  pull_request:
jobs:
  core:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift test
  app:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: xcodegen generate
      - run: >
          xcodebuild build -project FlagQuiz.xcodeproj -scheme FlagQuiz
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      # Compile the screenshot UI tests too, so they can't rot between manual screenshot runs.
      - run: >
          xcodebuild build-for-testing -project FlagQuiz.xcodeproj -scheme FlagQuizScreenshots
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      # TestFlight builds are Release builds, and Release-only code (ad configuration, no demo mode)
      # is never compiled by the Debug builds above, so compile it on every push too.
      - run: >
          xcodebuild build -project FlagQuiz.xcodeproj -scheme FlagQuiz -configuration Release
          -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
