# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: FlagQuiz
options:
  bundleIdPrefix: ai.knowlly
  deploymentTarget:
    iOS: "17.0"
packages:
  FlagQuiz:
    path: .
  GameTimeKit:
    url: https://github.com/AmrElsehemy/gametime-ios.git
    branch: master
  GeographicaKit:
    url: https://github.com/AmrElsehemy/geographica-kit.git
    branch: master
targets:
  FlagQuiz:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FlagQuiz
        product: FlagQuizCore
      - package: GameTimeKit
        product: GameTimeExperience
      - package: GameTimeKit
        product: GameTimeCommerce
      - package: GameTimeKit
        product: GameTimeAdMob
      - package: GeographicaKit
        product: GeographicaCore
      - package: GeographicaKit
        product: GeographicaFlags
    info:
      path: App/Info.plist   # generated by XcodeGen; not committed
      properties:
        CFBundleDisplayName: Flag Trek
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Google's sample AdMob app id. Replace with the real one before release.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # Production rewarded ad unit for "refuel". Empty = no ads in Release builds (safe default).
        FlagQuizRewardedUnitID: $(FLAGQUIZ_REWARDED_UNIT_ID)
    settings:
      base:
        FLAGQUIZ_REWARDED_UNIT_ID: ""
        PRODUCT_NAME: Flag Trek
        PRODUCT_BUNDLE_IDENTIFIER: ai.knowlly.flagquiz
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
  # UI tests that capture App Store screenshots from the real app. Run with
  # Scripts/capture-screenshots.sh. Swift 5 mode: XCTest's UI APIs are not yet Swift 6 clean.
  FlagQuizScreenshots:
    type: bundle.ui-testing
    platform: iOS
    sources: [ScreenshotTests]
    dependencies:
      - target: FlagQuiz
    settings:
      base:
        SWIFT_VERSION: "5.0"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: ai.knowlly.flagquiz.screenshots
        TEST_TARGET_NAME: FlagQuiz
# Once any scheme is declared XcodeGen stops generating the automatic ones, so the app's own scheme
# must be declared too.
schemes:
  FlagQuiz:
    build:
      targets:
        FlagQuiz: all
    run:
      config: Debug
    archive:
      config: Release
  FlagQuizScreenshots:
    build:
      targets:
        FlagQuiz: all
        FlagQuizScreenshots: [test]
    test:
      targets:
        - FlagQuizScreenshots
