# Generate the Xcode project with XcodeGen:  brew install xcodegen && xcodegen generate
name: FlagQuiz
options:
  bundleIdPrefix: ai.knowlly
  deploymentTarget:
    iOS: "17.0"
packages:
  FlagQuiz:
    path: .
  GameTimeKit:
    url: https://github.com/AmrElsehemy/gametime-ios.git
    branch: master
  GeographicaKit:
    url: https://github.com/AmrElsehemy/geographica-kit.git
    branch: master
targets:
  FlagQuiz:
    type: application
    platform: iOS
    sources: [App]
    dependencies:
      - package: FlagQuiz
        product: FlagQuizCore
      - package: GameTimeKit
        product: GameTimeExperience
      - package: GameTimeKit
        product: GameTimeCommerce
      - package: GameTimeKit
        product: GameTimeAdMob
      - package: GeographicaKit
        product: GeographicaCore
      - package: GeographicaKit
        product: GeographicaFlags
    info:
      path: App/Info.plist   # generated by XcodeGen; not committed
      properties:
        CFBundleDisplayName: Flags Adventure
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        # Google's sample AdMob app id. Replace with the real one before release.
        GADApplicationIdentifier: ca-app-pub-3940256099942544~1458002511
        # Production rewarded ad unit for "refuel". Empty = no ads in Release builds (safe default).
        FlagQuizRewardedUnitID: $(FLAGQUIZ_REWARDED_UNIT_ID)
    settings:
      base:
        FLAGQUIZ_REWARDED_UNIT_ID: ""
        PRODUCT_NAME: Geographica Flags
        PRODUCT_BUNDLE_IDENTIFIER: ai.knowlly.flagquiz
        SWIFT_VERSION: "6.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
